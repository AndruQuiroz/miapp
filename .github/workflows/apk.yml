name: APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        id: compilar
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p ../out
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../out/build.log
          cp app/build/outputs/apk/release/app-release.apk ../out/MiApp.apk

      - name: Publicar APK (descarga directa)
        if: steps.compilar.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/MiApp.apk \
            --title "Mi App para Android 1.0.${{ github.run_number }}" \
            --notes "Instala MiApp.apk en tu Android. Descarga directa: https://github.com/${{ github.repository }}/releases/latest/download/MiApp.apk" \
            --latest

      - name: Activar KVM
        if: steps.compilar.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          pip install websocket-client

      - name: Probar en emulador
        if: steps.compilar.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash android/ci/prueba.sh

      - name: Guardar resultados en la rama ci-out
        if: always()
        run: |
          mkdir -p out && cd out
          rm -f MiApp.apk
          echo "run ${{ github.run_number }} · ${{ github.sha }}" > RUN.txt
          git init -q && git checkout -q -b ci-out
          git add -A && git -c user.name=ci -c user.email=ci@miapp commit -qm "run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-out
