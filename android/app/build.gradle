plugins { id 'com.android.application' }

def runNum = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int

android {
    namespace 'com.andru.miapp'
    compileSdk 34
    defaultConfig {
        applicationId 'com.andru.miapp'
        minSdk 26
        targetSdk 34
        versionCode runNum
        versionName "1.0.${runNum}"
    }
    signingConfigs {
        release {
            storeFile file('../miapp.keystore')
            storePassword 'miapp-andru'
            keyAlias 'miapp'
            keyPassword 'miapp-andru'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
